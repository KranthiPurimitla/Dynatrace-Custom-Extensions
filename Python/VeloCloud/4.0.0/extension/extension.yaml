dashboards:
  - path: "dashboards/velocloudedgelinkdashboard.json"
  - path: "dashboards/veloclouddashboard.json"
topology:
  types:
    - enabled: true
      name: "custom:velocloudedge"
      displayName: "VeloCloud Edge"
      rules:
        - idPattern: "VeloCloud_{edge_name}"
          instanceNamePattern: "{edge_name}"
          iconPattern: network
          attributes:
            - key: edge_name
              pattern: "{edge_name}"
            - key: ip_address
              pattern: "{ip_address}"
            - key: edge_state
              pattern: "{edge_state}"
            - key: ha_state
              pattern: "{ha_state}"
            - key: service_state
              pattern: "{service_state}"
            - key: link_state
              pattern: "{link_state}"
          sources:
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.edge_state)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.ha_state)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.service_state)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.link_state)
          
    - enabled: true
      name: "custom:velocloudedgelink"
      displayName: "VeloCloud Edge Link"
      rules:
        - idPattern: "VeloCloud_{edge_name}_{ip_address}"
          instanceNamePattern: "{edge_name} ({ip_address})"
          iconPattern: "router"
          attributes:
            - key: edge_name
              pattern: "{edge_name}"
            - key: ip_address
              pattern: "{ip_address}"
            - key: edge_state
              pattern: "{edge_state}"
            - key: ha_state
              pattern: "{ha_state}"
            - key: service_state
              pattern: "{service_state}"
            - key: link_state
              pattern: "{link_state}"
          sources:
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.jitter_ms_tx)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.jitter_ms_rx)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.latency_ms_rx)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.latency_ms_tx)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.loss_pct_rx)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.loss_pct_tx)
          role: default

    - enabled: true
      name: "custom:velocloudedgeperformance"
      displayName: "VeloCloud Edge Performance"
      rules:
        - idPattern: "VeloCloud_{edge_name}"
          instanceNamePattern: "Velocloud_{edge_name}{edge_logical_id}"
          iconPattern: "router"
          attributes:
            - key: edge_name
              pattern: "{edge_name}"
            - key: edge_logical_id
              pattern: "{edge_logical_id}"
            - key: edge_state
              pattern: "{edge_state}"
            - key: ha_state
              pattern: "{ha_state}"
            - key: service_state
              pattern: "{service_state}"
            - key: link_state
              pattern: "{link_state}"
          sources:
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.cpu_utilization)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.cpu_core_temperature)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.memory_utilization)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.flow_count)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.over_capacity_drops)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.tunnel_count_v6)
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.tunnel_count) 
          role: default

    - enabled: true
      name: "custom:velocloudedgeoutage"
      displayName: "VeloCloud Edge Outage"
      rules:
        - idPattern: "VeloCloud_Outage_{edge_logical_id}"
          instanceNamePattern: "{edge_name} Outage Status"
          iconPattern: "router"
          attributes:
            - key: edge_name
              pattern: "{edge_name}"
            - key: edge_logical_id
              pattern: "{edge_logical_id}"
            - key: edge_state
              pattern: "{edge_state}"
            - key: ha_state
              pattern: "{ha_state}"
            - key: service_state
              pattern: "{service_state}"
          sources:
            - sourceType: Metrics
              condition: $eq(custom.velocloud.edge.all_links_offline)
          role: default  

python:
  runtime:
    module: velocloudextensionrevised
    version:
      min: "3.14"

  activation:
    remote:
      path: activationSchema.json
    local:
      path: activationSchema.json
  featureSets: # You MUST define the metrics under featureSets
    - featureSet: VeloCloudLinkMetrics  # Give it a meaningful name
      metrics:
        - key: custom.velocloud.edge.jitter_ms_rx
        - key: custom.velocloud.edge.latency_ms_rx
        - key: custom.velocloud.edge.loss_pct_rx
        - key: custom.velocloud.edge.jitter_ms_tx
        - key: custom.velocloud.edge.latency_ms_tx
        - key: custom.velocloud.edge.loss_pct_tx
      
    - featureSet: VeloCloudEdgeHealthMetrics  # Give it a meaningful name
      metrics:
        - key: custom.velocloud.edge.edge_state
        - key: custom.velocloud.edge.ha_state
        - key: custom.velocloud.edge.service_state
        - key: custom.velocloud.edge.link_state
    
    - featureSet: VeloCloudEdgeSystem_HealthMetrics  # Give it a meaningful name
      metrics:
        - key: custom.velocloud.edge.cpu_core_temperature
        - key: custom.velocloud.edge.cpu_utilization
        - key: custom.velocloud.edge.memory_utilization
        - key: custom.velocloud.edge.flow_count
        - key: custom.velocloud.edge.over_capacity_drops
        - key: custom.velocloud.edge.tunnel_count
        - key: custom.velocloud.edge.tunnel_count_v6

    - featureSet: VeloCloudEdgeOutageMetrics  # Give it a meaningful name
      metrics:
        - key: custom.velocloud.edge.all_links_offline
alerts:
  - path: alerts/alert-003-edge-high-core-temperature-utilization.json
  - path: alerts/alert-002-edge-high-memory-utilization.json
  - path: alerts/alert-001-edge-high-cpu-utiization.json
