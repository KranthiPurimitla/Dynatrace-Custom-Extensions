    metadata:
      displayName: "Jitter (ms) RX"
      description: "Received jitter in milliseconds for the VeloCloud edge"
      unit: MilliSecond
      dimensions:
      - key: edge_name
        displayName: "Edge Name"
      - key: ip_address
        displayName: "IP Address"
      - key: edge_state
        displayName: "Edge State"
      - key: ha_state
        displayName: "Edge HA State"
      - key: service_state
        displayName: "Service State"
      - key: link_state
        displayName: "Edge Link State"
      tags:
      - custom.extension.velocloud

  - key: custom.velocloud.edge.latency_ms_rx
